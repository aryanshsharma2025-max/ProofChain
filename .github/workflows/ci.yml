name: ProofChain CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  blockchain-tests:
    name: Smart Contract Hardhat Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: blockchain/package-lock.json

      - name: Install Blockchain Dependencies
        run: npm ci

      - name: Compile Solidity Contracts and Run Tests
        run: npx hardhat test

  frontend-checks:
    name: Frontend Tests and Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Consistency Unit Tests
        run: npm test

      - name: TypeScript Check and Production Build
        run: npm run build
